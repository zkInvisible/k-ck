services:
  - type: web
    name: kick-chat-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false          # Render dashboard'dan elle doldur
      - key: TELEGRAM_CHAT_ID
        sync: false          # Render dashboard'dan elle doldur
      - key: KICK_CHANNEL
        sync: false          # Örnek: xqc, trainwreck, vb.
      - key: TIME_WINDOW
        value: "15"          # saniye
      - key: MIN_USERS
        value: "5"          # farklı kullanıcı sayısı
      - key: MIN_MSG_LENGTH
        value: "1"           # minimum mesaj uzunluğu
      - key: PUSHER_APP_KEY
        value: "eb1d5f283081a78b932c"
    # Render free tier uyku modunu engeller (UptimeRobot ile kullanın)
    healthCheckPath: /health
